/* ---------- подстановки в тексте: {дата}, {время}, {?Поле} ---------- */
// Автоматические: {дата} {дата+7} {дата-1} {время} {год} {месяц} {число} {день недели}.
// Поля: {?Имя} или {?Имя=по умолчанию} — перед копированием приложение спросит значение.
// Любые другие фигурные скобки остаются в тексте как есть.
const TOKEN_RE = /\{(\?)?([^{}\n]{1,80})\}/g;
const WEEKDAYS = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const substOn = () => readMeta().subst !== false;
// имя подстановки приводим к одному виду: регистр, ё, неразрывные пробелы, лишние пробелы, латинские буквы-двойники
const LAT2CYR = { a: 'а', c: 'с', e: 'е', o: 'о', p: 'р', x: 'х', y: 'у', k: 'к', m: 'м', t: 'т', b: 'в', h: 'н' };
function normName(name) {
  let n = name.replace(/[\u00a0\u2007\u202f]/g, ' ').trim().toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ');
  if (/[а-я]/.test(n)) n = n.replace(/[a-z]/g, c => LAT2CYR[c] || c);        // «дaта» с латинской «a» тоже распознаётся
  return n;
}
function autoToken(name, now) {
  const n = normName(name), p2 = x => String(x).padStart(2, '0');
  const shift = k => { const d = new Date(now); if (k) d.setDate(d.getDate() + k); return d; };
  const ddmmyyyy = d => p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear();
  let m = n.match(/^(?:дата|date)\s*(?:([+\-−–])\s*(\d{1,4}))?$/);
  if (m) return ddmmyyyy(shift(m[1] ? (m[1] === '+' ? 1 : -1) * parseInt(m[2], 10) : 0));
  if (n === 'сегодня' || n === 'today') return ddmmyyyy(now);
  if (n === 'вчера') return ddmmyyyy(shift(-1));
  if (n === 'завтра') return ddmmyyyy(shift(1));
  if (n === 'послезавтра') return ddmmyyyy(shift(2));
  m = n.match(/^дата (текстом|прописью)(?:\s*([+\-−–])\s*(\d{1,4}))?$/);
  if (m) { const d = shift(m[2] ? (m[2] === '+' ? 1 : -1) * parseInt(m[3], 10) : 0); return d.getDate() + ' ' + MONTHS_GEN[d.getMonth()] + ' ' + d.getFullYear() + ' г.'; }
  if (n === 'дата кратко') return p2(now.getDate()) + '.' + p2(now.getMonth() + 1);
  if (n === 'время' || n === 'time') return p2(now.getHours()) + ':' + p2(now.getMinutes());
  if (n === 'год') return String(now.getFullYear());
  if (n === 'месяц') return MONTHS[now.getMonth()];
  if (n === 'число') return String(now.getDate());
  if (n === 'день недели') return WEEKDAYS[now.getDay()];
  return null;
}
// фигурные скобки, которые похожи на попытку подстановки, но не распознаны (чтобы сообщить об опечатке)
function unknownTokens(texts) {
  const out = [];
  texts.forEach(t => { for (const m of t.matchAll(TOKEN_RE)) {
    if (m[1]) continue;
    const n = normName(m[2]);
    if (/^(дат|врем|год|месяц|числ|день|сегодн|вчера|завтра|date|time)/.test(n) && autoToken(m[2], new Date()) === null && !out.includes(m[0])) out.push(m[0]);
  } });
  return out;
}
function parseField(body) {
  const i = body.indexOf('=');
  return i < 0 ? { name: body.trim(), def: '' } : { name: body.slice(0, i).trim(), def: body.slice(i + 1) };
}
function hasSubst(text) {
  for (const m of text.matchAll(TOKEN_RE)) { if (m[1] ? parseField(m[2]).name : autoToken(m[2], new Date()) !== null) return true; }
  return false;
}
function collectFields(texts) {
  const seen = new Map();
  texts.forEach(t => { for (const m of t.matchAll(TOKEN_RE)) { if (m[1]) { const f = parseField(m[2]); if (f.name && !seen.has(f.name)) seen.set(f.name, f); } } });
  return [...seen.values()];
}
function expandText(t, values) {
  const now = new Date();
  return t.replace(TOKEN_RE, (all, q, body) => {
    if (q) { const f = parseField(body); if (!f.name) return all; return Object.prototype.hasOwnProperty.call(values, f.name) ? values[f.name] : f.def; }
    const r = autoToken(body, now);
    return r === null ? all : r;
  });
}
function fieldsDialog(fields) {
  return new Promise(resolve => {
    const mem = readMeta().fieldMem || {};
    openModal((box, api) => {
      api.dismiss = () => { api.close(); resolve(null); };
      const inputs = fields.map(f => h('input', { class: 'field', type: 'text', 'aria-label': f.name, placeholder: f.name, value: f.def || mem[f.name] || '' }));
      const done = () => {
        const vals = {}, m = readMeta(); m.fieldMem = m.fieldMem || {};
        fields.forEach((f, i) => { vals[f.name] = inputs[i].value; m.fieldMem[f.name] = inputs[i].value; });
        writeMeta(m); api.close(); resolve(vals);
      };
      inputs.forEach((inp, i) => inp.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        e.preventDefault(); if (i < inputs.length - 1) inputs[i + 1].focus(); else done();
      }));
      box.append(h('h2', { text: 'Заполните поля' }),
        ...fields.flatMap((f, i) => [h('label', { class: 'lbl', text: f.name }), inputs[i]]),

      setTimeout(() => { inputs[0].focus(); inputs[0].select(); }, 30);
    });

}
// тексты → тексты с подставленными значениями; null — пользователь отменил ввод полей
async function prepareTexts(texts) {
  if (!substOn()) {
    if (texts.some(hasSubst)) setTimeout(() => toast('Подстановки выключены: Меню → Ещё… → Подстановки', true), 1400);
    return texts;
  }
  const fields = collectFields(texts);
  let values = {};
  if (fields.length) { values = await fieldsDialog(fields); if (!values) return null; }
  const bad = unknownTokens(texts);
  if (bad.length) setTimeout(() => toast('Не распознано: ' + bad.slice(0, 3).join(' '), true), 1400);
  return texts.map(t => expandText(t, values));
}
function substSheet() {

      h('p', { class: 'msg', style: 'margin-bottom:4px', text: 'Автоматически (сейчас). Нажмите на подстановку — она скопируется, останется вставить в шаблон:' }),
      h('ul', { class: 'pvmeta', style: 'margin:0 0 10px 18px;padding:0' },
        ex('{дата}'), ex('{дата+7}'), ex('{дата-1}'), ex('{время}'), ex('{число}'), ex('{месяц}'), ex('{год}'), ex('{день недели}')),

      h('p', { class: 'msg', text: 'Любые другие скобки (например, в коде или JSON) остаются в тексте как есть. Допустимы также {сегодня}, {завтра}, {вчера}, {дата текстом}, {дата кратко}; регистр и «ё» не важны.' }),

/* ---------- склеить выбранные шаблоны в один текст ---------- */
const JOIN_SEPS = { nl: ['Новая строка', '\n'], blank: ['Пустая строка', '\n\n'], comma: ['Запятая', ', '], space: ['Пробел', ' '], none: ['Без разделителя', ''] };
// выбранные шаблоны в порядке выбора (выбранная группа — все её активные шаблоны); mode 'list' — в порядке базы
function selectionItems(mode) {
  const res = [], seen = new Set();
  const add = (tab, it) => { if (!seen.has(it.id)) { seen.add(it.id); res.push({ tab, it }); } };
  for (const key of sel) {
    if (key.startsWith('i:')) { const l = locate(key.slice(2)); if (l) add(l.tab, l.it); }
    else if (key.startsWith('g:')) {
      for (const tab of state.tabs) {
        const g = gById(tab, key.slice(2)); if (!g) continue;
        const ids = new Set([g.id, ...descendantsOf(tab, g).map(x => x.id)]);
        tab.items.filter(i => ids.has(i.group) && !i.archived).forEach(it => add(tab, it));
      }
    }
  }
  if (mode === 'list') res.sort((a, b) => (state.tabs.indexOf(a.tab) - state.tabs.indexOf(b.tab)) || (a.tab.items.indexOf(a.it) - b.tab.items.indexOf(b.it)));
  return res;
}
function joinSheet() {
  const prefs = { sep: 'blank', titles: false, order: 'picked', ...(readMeta().joinPrefs || {}) };
  openModal((box, api) => {
    const build = (values) => {
      const items = selectionItems(prefs.order).map(x => x.it);
      const sep = (JOIN_SEPS[prefs.sep] || JOIN_SEPS.blank)[1];
      return { items, text: items.map(it => (prefs.titles && it.title ? it.title + '\n' : '') + (substOn() ? expandText(it.text, values || {}) : it.text)).join(sep) };
    };
    const draw = () => {
      const r = build(null);
      const keep = () => { const m = readMeta(); m.joinPrefs = { ...prefs }; writeMeta(m); draw(); };
      const titles = h('input', { type: 'checkbox' }); titles.checked = prefs.titles;
      titles.addEventListener('change', () => { prefs.titles = titles.checked; keep(); });
      const snip = r.text.length > 260 ? r.text.slice(0, 260) + '…' : r.text;
      box.replaceChildren(
        h('h2', { text: 'Склеить и скопировать' }),
        h('p', { class: 'msg', text: 'Шаблонов: ' + r.items.length + ', символов: ' + r.text.length }),
        h('div', { class: 'uilbl', text: 'Разделитель' }),
        h('div', { class: 'thm' }, Object.entries(JOIN_SEPS).map(([k, [n]]) => btn(n, () => { prefs.sep = k; keep(); }, prefs.sep === k ? 'primary' : ''))),
        h('div', { class: 'uilbl', text: 'Порядок' }),
        h('div', { class: 'thm' },
          btn('Как выбирали', () => { prefs.order = 'picked'; keep(); }, prefs.order === 'picked' ? 'primary' : ''),
          btn('Как в базе', () => { prefs.order = 'list'; keep(); }, prefs.order === 'list' ? 'primary' : '')),
        h('label', { class: 'chk' }, titles, h('span', { text: 'Добавлять название над текстом' })),
        h('div', { class: 'uilbl', text: 'Предпросмотр' }),
        h('pre', { class: 'pv', text: snip || '(пусто)' }),
        h('div', { class: 'btns', style: 'margin-top:10px' },
          btn('Копировать', async () => {
            const items = build(null).items;
            const texts = items.map(it => it.text);
            const out = await prepareTexts(texts);           // поля спрашиваются один раз на всё
            if (!out) return;
            const sepStr = (JOIN_SEPS[prefs.sep] || JOIN_SEPS.blank)[1];
            const full = items.map((it, i) => (prefs.titles && it.title ? it.title + '\n' : '') + out[i]).join(sepStr);
            const ok = await copyText(full);
            api.close();
            if (ok) { selMode = false; sel.clear(); renderList(); }
            toast(ok ? '✓ Скопировано: ' + items.length + ' шт., ' + full.length + ' симв.' : 'Не удалось скопировать', !ok);
          }, 'primary'),
          btn('Отмена', () => api.close(), 'ghost')));
    };
    draw();
  });
}

/* ---------- оформление и размеры (отдельно для телефона и компьютера; в экспорт не входят) ---------- */

    if (Math.abs(vv.width - lastW) > 1) { maxH = vv.height; lastW = vv.width; }   // поворот экрана
    maxH = Math.max(maxH, vv.height);
    const r = document.documentElement;
    r.style.setProperty('--vvh', vv.height + 'px');
    r.style.setProperty('--vvt', vv.offsetTop + 'px');
    r.classList.toggle('kb', vv.height < maxH * 0.8);
  };
  vv.addEventListener('resize', apply);
  vv.addEventListener('scroll', apply);
  apply();
})();

/* ---------- обновление приложения (работает при установке с хостинга по https) ---------- */
let swReg = null, updWorker = null;
function showUpdate(worker) { updWorker = worker; $('#updbar').hidden = false; }
function applyUpdate() {
  if (updWorker) { $('#updBtn').disabled = true; updWorker.postMessage({ type: 'SKIP_WAITING' }); setTimeout(() => location.reload(), 4000); }
  else location.reload();
}
async function checkUpdate() {
  if (!swReg) { toast('Проверка обновлений работает в приложении, открытом с хостинга (https)', true); return; }
  if (swReg.waiting && navigator.serviceWorker.controller) { showUpdate(swReg.waiting); return; }
  toast('Проверяю…');
  try { await swReg.update(); } catch (e) { toast('Нет связи — не удалось проверить', true); return; }
  setTimeout(() => {
    if (swReg.waiting && navigator.serviceWorker.controller) showUpdate(swReg.waiting);
    else if (swReg.installing) toast('Скачиваю новую версию…');
    else toast('У вас последняя версия ✓');
  }, 1200);
}
$('#updBtn').addEventListener('click', applyUpdate);
$('#updX').addEventListener('click', () => { $('#updbar').hidden = true; });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    swReg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w); });
    });
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || reloading) return; reloading = true; location.reload(); });
  // при возвращении в приложение — тихая проверка
  document.addEventListener('visibilitychange', () => { if (!document.hidden && swReg) swReg.update().catch(() => {}); });
}
})();
