<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d6b5b">
<title>Мои шаблоны</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#eff2f0; --surface:#ffffff; --ink:#182022; --muted:#62706f; --line:#d9dfdc;
  --accent:#0d6b5b; --accent-ink:#ffffff; --accent-soft:#d7eee8; --danger:#b3261e;
  --shadow:0 6px 20px rgba(13,40,35,.22);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101416; --surface:#1a2124; --ink:#e6ecea; --muted:#93a29f; --line:#2b3538;
    --accent:#5cc9b3; --accent-ink:#06251f; --accent-soft:#1c3a35; --danger:#ff8a80;
    --shadow:0 6px 20px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  touch-action:manipulation;
  padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 12px}

/* --- верхняя панель --- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);
  border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 0 4px}
.bar h1{font-size:20px;margin:0;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  font-size:22px;line-height:1;color:var(--muted);flex:none}
.tabsbar{display:flex;gap:8px;align-items:center;padding:4px 0}
.tabs{flex:1;display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.search{padding:10px 0 0}
.field{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--ink)}
.field:focus{outline:2px solid var(--accent);outline-offset:1px}
.area{min-height:160px;resize:vertical;line-height:1.45;flex:1}
#warn{background:#fff3cd;color:#4d3b00;padding:10px 14px;border-radius:12px;margin:10px 0 0;font-size:14px}
@media (prefers-color-scheme:dark){#warn{background:#41340a;color:#ffe9a6}}

/* --- список --- */
#list{padding-top:12px;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:stretch}
.card{position:relative;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:72px;
  padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);
  transition:background .12s,transform .06s;overflow:hidden}
.card:active{transform:scale(.99)}
.card.fav{border-left:5px solid var(--accent)}
.card.flash{background:var(--accent-soft);border-color:var(--accent)}
.ttl{font-weight:650;font-size:17px;overflow-wrap:anywhere}
.pre{color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ok-badge{position:absolute;right:12px;top:12px;font-size:13px;font-weight:700;color:var(--accent);
  opacity:0;transition:opacity .12s}
.card.flash .ok-badge{opacity:1}
.more{border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:24px;color:var(--muted)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:18px;margin:0 0 6px}
.empty p{margin:0 0 16px}
.card.notitle .pre{color:var(--ink);font-size:16px;-webkit-line-clamp:4}
.ok-badge{background:var(--accent-soft);padding:2px 8px;border-radius:8px}
.ghead{display:grid;grid-template-columns:1fr 44px 44px;gap:6px;align-items:center;margin-top:10px;
  border-bottom:1px solid var(--line);padding-bottom:4px}
.gtoggle{display:flex;gap:8px;align-items:center;min-height:44px;background:none;border:0;text-align:left;
  font-weight:700;font-size:15px;padding:0;min-width:0}
.gname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--muted);width:14px;flex:none}
.gcount{color:var(--muted);font-weight:500;font-size:13px}
.gbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);font-size:20px}
.gempty{margin:0;color:var(--muted);font-size:14px;padding:2px 4px}
.search{display:flex;gap:8px}
.search .field{flex:1;min-width:0}
.scope{flex:none;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);font-weight:600;font-size:14px;color:var(--muted)}
.scope.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scope:disabled{opacity:.4}
.archhead{display:flex;align-items:center;gap:8px;min-height:48px;margin-top:14px;padding:0 4px;width:100%;
  background:none;border:0;border-top:2px dashed var(--line);font-weight:700;color:var(--muted);text-align:left}
.card.arch{border-style:dashed}
.gbox{display:flex;flex-direction:column;gap:10px;margin-left:12px;padding-left:10px;border-left:2px solid var(--line)}
.sgbody .sgroup{margin-left:12px}
.iconbtn svg{width:26px;height:26px;fill:currentColor;display:block;margin:auto}
.agh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 4px 0}
.agh span{font-size:13px;font-weight:700;color:var(--muted)}
.tabhead{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-top:10px;padding:0 4px;
  background:none;border:0;border-bottom:2px solid var(--accent);font-weight:700;color:var(--accent);text-align:left;width:100%}
.gsub{margin:4px 4px 0;font-size:13px;font-weight:700;color:var(--muted)}
.tr2{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tinfo{flex:1;min-width:0}
.tname{font-weight:600;overflow-wrap:anywhere}
.tbtn{background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;font:inherit;display:block;width:100%}
.tsub{margin-left:14px;padding-left:10px;border-left:2px solid var(--line)}
.tsub .tname{font-weight:500;font-size:15px}
.tmeta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.mrow{display:grid;gap:8px}
.cell{position:relative;min-width:0}
.cell .card{width:100%;height:100%;min-height:64px;padding:10px 32px 10px 10px;gap:2px}
.cell .ttl{font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .pre{font-size:13px;-webkit-line-clamp:2}
.cell .card.notitle .pre{font-size:15px;-webkit-line-clamp:3}
.cell .card.fav{border-left-width:4px}
.cell .more{position:absolute;top:2px;right:2px;width:34px;height:34px;border:0;background:transparent;font-size:20px;border-radius:10px}
.cell .ok-badge{top:auto;bottom:6px;right:8px;padding:0 6px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.chk input:disabled+span{color:var(--muted)}
.card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pair .btn{flex:1;width:auto;min-width:0;padding:0 8px}
.pair .btn.icon{flex:none;width:52px;padding:0}
.pv{white-space:pre-wrap;overflow-wrap:anywhere;max-height:50dvh;overflow:auto;background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin:0 0 6px}
.pvmeta{color:var(--muted);font-size:13px;margin:0 0 12px}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg .btn{min-height:44px;flex:1;width:auto}
.hdr-btns{display:flex;gap:6px;flex:none}
.iconbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;margin:10px 0 0;
  background:var(--accent-soft);border-radius:12px;font-size:14px}
.srow{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:6px 12px 6px 4px;min-height:56px}
.srow.chained{margin-left:24px}
.srow.pre-alone{margin-left:0}
.srow.pre-join{margin-left:24px}
.sblock{display:flex;flex-direction:column;gap:6px}
.sblock.multi{background:var(--accent-soft);border-radius:16px;padding:6px}
.sblock.pre-join{margin-left:24px}
.sblock.pre-join>.srow:first-child .shint{display:block}
.sblock.pre-join>.srow:first-child .shint::before{content:'→ в строку с предыдущим'}
.sgroup{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.sghead{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);padding-bottom:2px}
.sgtoggle{flex:1;display:flex;align-items:center;gap:8px;min-height:44px;background:none;border:0;text-align:left;
  font-weight:700;font-size:15px;padding:0;min-width:0}
.dragging-groups .sgbody{display:none}
.sgbody{display:flex;flex-direction:column;gap:10px}
.shint{display:none;flex:none;font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.srow.pre-alone .shint,.srow.pre-join .shint{display:block}
.srow.pre-alone .shint::before{content:'← отдельная строка'}
.srow.pre-join .shint::before{content:'→ в строку с предыдущим'}
.srow.fav{border-left:4px solid var(--accent)}
.handle,.hnd{touch-action:none;cursor:grab;color:var(--muted)}
.handle{width:44px;height:44px;flex:none;border:0;background:transparent;font-size:24px}
.sbody{flex:1;min-width:0}
.sbody .ttl{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbody .pre{-webkit-line-clamp:1}
.dragging{position:relative;z-index:6;box-shadow:var(--shadow);user-select:none}
.trow .ic{width:40px;height:40px;font-size:17px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:2px 0 -4px}

#add{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:4;height:56px;padding:0 26px;border:0;border-radius:28px;background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:16px;box-shadow:var(--shadow);white-space:nowrap}
#add[hidden]{display:none}

/* --- кнопки --- */
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  font-weight:600;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.exp{font-weight:800}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.35;cursor:default}

/* --- окна --- */
.overlay{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;
  padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92dvh;overflow:auto}
.sheet.editor{display:flex;flex-direction:column;gap:8px;align-self:flex-start;margin-top:8px;max-height:none;
  height:calc(var(--vvh, 100dvh) - 16px);padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));border-radius:16px}
@media (min-width:640px){.sheet.editor{align-self:center;margin-top:0;height:min(86vh,720px)}}
.sheet.editor .ed-title{margin:0;font-size:16px}
.sheet.editor .area{min-height:96px}
.ed-more{background:none;border:0;padding:0;min-height:36px;text-align:left;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.ed-extra{display:flex;flex-direction:column;gap:8px}
.kb .sheet.editor .ed-title,.kb .sheet.editor .ed-more,.kb .sheet.editor .ed-extra{display:none}
.sheet h2{margin:0 0 12px;font-size:18px;overflow-wrap:anywhere}
.sheet .msg{margin:0 0 14px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-line}
.btns{display:flex;flex-direction:column;gap:8px}
.btns.two{flex-direction:row}
.btn.icon{flex:none;width:52px;padding:0;font-size:20px}
.conf{padding:10px 0;border-bottom:1px solid var(--line)}
.conf .pair{margin-top:6px}
.conf .pair .btn{min-height:40px;font-size:14px}
.cver{font-size:13px;overflow-wrap:anywhere;margin:2px 0;color:var(--muted)}
.cver b{color:var(--ink)}
.stickfoot{position:sticky;bottom:-16px;background:var(--surface);padding-top:10px}
.pair{display:flex;gap:8px}
.err{color:var(--danger);font-size:14px;margin:0}
.tablist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.trow{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--line)}
.tn{flex:1;font-weight:600;overflow-wrap:anywhere}
.tc{color:var(--muted);font-size:13px;min-width:22px;text-align:right}
.ic{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.ic:disabled{opacity:.3}
@media (min-width:640px){
  .overlay{align-items:center}
  .sheet{border-radius:16px}
  .btns.two .btn{width:auto;flex:1}
  .btns.two .btn.icon{flex:none;width:52px}
}
#updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:10px;
  width:max-content;max-width:calc(100vw - 24px);padding:8px 8px 8px 16px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-size:15px}
#updbar[hidden]{display:none}
#updbar .ub{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700}
#updbar .ux{min-height:40px;width:36px;border:0;background:none;color:inherit;font-size:18px;opacity:.7}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);
  z-index:40;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--danger);color:#fff}
#toast.undo{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 10px 8px 18px}
.tundo{border:1.5px solid currentColor;border-radius:999px;background:none;color:inherit;font-weight:800;font-size:14px;padding:6px 14px}
.remind{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.remind span{flex:1 1 200px}
.remind .btn{width:auto;min-height:36px;padding:0 14px;font-size:14px}
.drop-target{outline:2px dashed var(--accent);outline-offset:3px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* карточка и «⋯» — одна общая рамка; зона вокруг «⋯» открывает настройки шаблона */
.row{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row.arch{border-style:dashed}
.row .card{flex:1;min-width:0;border:0;border-radius:0;background:transparent}
.row .card.fav{border-left:5px solid var(--accent)}
.row .card.flash{background:var(--accent-soft)}
.row .more{flex:none;width:52px;border:0;border-left:1px solid var(--line);border-radius:0;background:transparent}
.row .more:active{background:var(--accent-soft)}
.pvhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pvhead h2{margin:0;flex:1;min-width:0}
.pvmore{flex:none;width:40px;height:40px;margin:-6px 0;font-size:22px;border-radius:12px}
/* без разделителя между карточкой и «⋯» */
.row .more{border-left:0}
/* группы и подгруппы: цветная линия слева ведёт к вложенным шаблонам, заголовок — цветная плашка */
:root{--gl0:#0d6b5b;--gl1:#3f7f99;--gl2:#8a63a8;--gl3:#a8566e;--gh0:#d3eae4;--gh1:#d8e7ee;--gh2:#e5dbee;--gh3:#efdce2}
@media (prefers-color-scheme:dark){:root{--gl0:#5cc9b3;--gl1:#6fb0cc;--gl2:#b793d4;--gl3:#d98ba0;--gh0:#1d3a35;--gh1:#1d3340;--gh2:#33284a;--gh3:#412733}}
.gd0{--gl:var(--gl0);--gh:var(--gh0)}
.gd1{--gl:var(--gl1);--gh:var(--gh1)}
.gd2{--gl:var(--gl2);--gh:var(--gh2)}
.gd3{--gl:var(--gl3);--gh:var(--gh3)}
.gwrap,.sgroup{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--gl);padding-left:6px;margin-top:0}
.sgroup{margin-left:0}
.sgbody .sgroup{margin-left:0}
.ghead{display:grid;grid-template-columns:1fr 40px 40px;gap:0;align-items:center;min-height:40px;margin-top:0;padding:0 0 0 8px;
  border-bottom:0;background:var(--gh);border-radius:8px}
.sghead{display:flex;align-items:center;gap:2px;min-height:40px;padding:0;border-bottom:0;background:var(--gh);border-radius:8px}
.ghead.sel{grid-template-columns:1fr 40px}
.gtoggle,.sgtoggle{min-height:40px}
.gname{font-weight:800}
.gbtn{width:40px;height:40px;border:0;background:transparent;color:var(--ink);font-size:20px;border-radius:8px}
/* режим выбора */
.cb{display:inline-block;width:22px;height:22px;border:2px solid var(--muted);border-radius:50%;line-height:18px;font-size:14px;font-weight:800;text-align:center;color:var(--accent-ink);vertical-align:middle}
.on .cb,.picked .cb{background:var(--accent);border-color:var(--accent)}
.inh .cb{opacity:.45}
.row.picked{background:var(--accent-soft);border-color:var(--accent)}
.cell.picked .card{background:var(--accent-soft);border-color:var(--accent)}
.ghead.picked{outline:2px solid var(--accent);outline-offset:-2px}
.selmore .cb{display:block;margin:auto}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 14px rgba(0,0,0,.14)}
.selrow1{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.selrow1 span{flex:1;font-weight:700;font-size:14px;min-width:0}
.selrow2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.selbar .btn{min-height:44px;font-size:14px;padding:0 6px;width:auto}
.selbar .btn.sm{min-height:34px;padding:0 10px}
body.selmode{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.selmode #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
/* «папка» (заголовок) — плотная цветная полоса слева, вложенные шаблоны — тонкая светлая линия */
:root{--glt0:#a5d3ca;--glt1:#adcdda;--glt2:#d0bbdd;--glt3:#e2b9c6}
@media (prefers-color-scheme:dark){:root{--glt0:#2c6a5e;--glt1:#33596b;--glt2:#563f6d;--glt3:#6b3a4b}}
.gd0{--glt:var(--glt0)}
.gd1{--glt:var(--glt1)}
.gd2{--glt:var(--glt2)}
.gd3{--glt:var(--glt3)}
.gwrap,.sgroup{border-left:2px solid var(--glt);padding-left:7px}
.gwrap>.ghead,.sgroup>.sghead{margin-left:-9px;border-left:4px solid var(--gl)}
.gwrap>.ghead{padding-left:5px}
/* заголовки групп чуть выше — удобнее попадать пальцем */
.ghead,.sghead{min-height:48px}
.ghead{grid-template-columns:1fr 44px 44px}

<script>
(() => {
'use strict';

/* ---------- утилиты ---------- */
const KEY = 'my-templates-v1';
const APP_VERSION = '2026-10-29.2';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const $ = s => document.querySelector(s);

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'value') e.value = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
}

/* ---------- данные ---------- */
let storageOk = true;
let query = '';
let scope = 'tab';
let sortMode = false;
const sortSel = new Set();     // отмеченные строки (id первого шаблона строки): тянутся пачкой
let selMode = false;
const sel = new Set();     // ключи: 'i:<id шаблона>', 'g:<id группы>'
let selVisible = [];       // id шаблонов, показанных на экране (для «Все»)
let searchArchive = false;

const isObj = v => v && typeof v === 'object';
const MAX_DEPTH = 4; // уровней вложенности: группа → подгруппа → подгруппа → ещё одна → ещё одна
const MAX_ROW = 4;   // сколько шаблонов можно поставить в одну строку
const TRASH_MS = 30 * 24 * 3600 * 1000;

function normItem(i, gids) {
  return {
    id: typeof i.id === 'string' && i.id ? i.id : uid(),
    title: String(i.title ?? '').slice(0, 200),
    text: String(i.text ?? ''),
    fav: !!i.fav,
    inline: !!i.inline,
    archived: !!i.archived,
    archByGroup: !!i.archByGroup,
    mod: Number(i.mod) || 0,
    cr: Number(i.cr) || 0,
    pin: Number(i.pin) || 0,
    group: gids && gids.has(i.group) ? i.group : null
  };
}
function normGroup(g) {
  return {
    id: typeof g.id === 'string' && g.id ? g.id : uid(),
    name: String(g.name ?? '').trim().slice(0, 60) || 'Группа',
    collapsed: !!g.collapsed,
    archived: !!g.archived,
    archByParent: !!g.archByParent,
    after: typeof g.after === 'string' ? g.after : undefined,
    parent: typeof g.parent === 'string' && g.parent ? g.parent : null
  };
}
function normTab(t) {
  const groups = (Array.isArray(t.groups) ? t.groups : []).filter(isObj).map(normGroup);
  const gids = new Set(groups.map(g => g.id));
  const byId = new Map(groups.map(g => [g.id, g]));
  groups.forEach(g => { if (g.parent && (g.parent === g.id || !byId.has(g.parent))) g.parent = null; });
  groups.forEach(g => {                    // циклы и слишком глубокая вложенность
    let d = 0, x = g; const seen = new Set([g.id]);
    while (x.parent) {
      x = byId.get(x.parent);
      if (!x || seen.has(x.id)) { g.parent = null; break; }
      seen.add(x.id); d++;
      if (d >= MAX_DEPTH) { g.parent = null; break; }
    }
  });
  return {
    id: typeof t.id === 'string' && t.id ? t.id : uid(),
    name: String(t.name ?? '').trim().slice(0, 60) || 'Без названия',
    groups,
    archived: !!t.archived,
    archiveOpen: !!t.archiveOpen,
    items: (Array.isArray(t.items) ? t.items : []).filter(isObj).map(i => normItem(i, gids))
  };
}
function normTrash(e) {
  if (!isObj(e)) return null;
  const base = {
    id: typeof e.id === 'string' && e.id ? e.id : uid(),
    deletedAt: Number(e.deletedAt) || Date.now(),
    tabId: String(e.tabId ?? ''),
    tabName: String(e.tabName ?? '').slice(0, 60)
  };
  if (e.kind === 'item' && isObj(e.item)) {
    return { ...base, kind: 'item', groupId: String(e.groupId ?? ''), groupName: String(e.groupName ?? '').slice(0, 60), item: normItem(e.item, null) };
  }
  if (e.kind === 'group' && isObj(e.group)) {
    const g = normGroup(e.group);
    const subs = (Array.isArray(e.subs) ? e.subs : []).filter(isObj).map(normGroup);
    const gids = new Set([g.id, ...subs.map(x => x.id)]);
    return { ...base, kind: 'group', group: g, subs, items: (Array.isArray(e.items) ? e.items : []).filter(isObj).map(i => normItem(i, gids)) };
  }
  if (e.kind === 'tab' && isObj(e.tab)) return { ...base, kind: 'tab', tab: normTab(e.tab) };
  return null;
}
function normalize(d) {
  if (!isObj(d) || !Array.isArray(d.tabs)) return null;
  const tabs = d.tabs.filter(isObj).map(normTab);
  const active = tabs.some(t => t.id === d.active) ? d.active : (tabs[0] ? tabs[0].id : null);
  const trash = (Array.isArray(d.trash) ? d.trash : []).map(normTrash).filter(Boolean);
  const ro = isObj(d.recentOpen) ? d.recentOpen : {};
  return { tabs, active, trash, special: !!d.special, recentOpen: { created: !!ro.created, edited: !!ro.edited } };
}

function seed() {
  const tid = uid();
  return {
    active: tid,
    trash: [],
    tabs: [{ id: tid, name: 'Работа', groups: [], items: [{
      id: uid(), title: '', fav: false, group: null,
      text: 'Нажмите на карточку — этот текст скопируется в буфер обмена.\nКнопка ⋯ справа: редактировать, дублировать, порядок, удалить.'
    }] }]
  };
}

function load() {
  try {
    localStorage.setItem(KEY + ':test', '1');
    localStorage.removeItem(KEY + ':test');
  } catch (e) { storageOk = false; }
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = normalize(JSON.parse(raw)); if (s) return s; }
  } catch (e) { /* пустое или повреждённое хранилище */ }
  return seed();
}

let state = load();
state.trash = state.trash.filter(e => Date.now() - e.deletedAt < TRASH_MS);

let saveSeq = 0;
function save() {
  saveSeq++;
  { const tt = document.getElementById('toast'); if (tt && tt.classList.contains('undo')) tt.className = ''; }
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    if (!storageOk) { storageOk = true; showWarn(); }
    maybeAuto();
  } catch (e) {
    storageOk = false; showWarn();
  }
}

function showWarn() {
  const w = $('#warn');
  if (storageOk) { w.hidden = true; return; }
  w.hidden = false;
  w.textContent = 'В этом режиме открытия браузер не даёт сохранять данные — после закрытия они пропадут. Откройте приложение по адресу (см. инструкцию) или регулярно делайте «Экспорт».';
}

if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }

/* ---------- резервная копия перед импортом и напоминание об экспорте ---------- */
const BACKUP_KEY = KEY + ':backup', META_KEY = KEY + ':meta';
const readMeta = () => { try { return JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch (e) { return {}; } };
const writeMeta = m => { try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e) {} };
const fmtDate = ts => new Date(ts).toLocaleDateString('ru-RU');
const fmtFull = ts => new Date(ts).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const fmtDateTime = ts => new Date(ts).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
function makeBackup(reason) {
  try { localStorage.setItem(BACKUP_KEY, JSON.stringify({ ts: Date.now(), reason, data: state })); return true; } catch (e) { return false; }
}
function readBackup() {
  try {
    const b = JSON.parse(localStorage.getItem(BACKUP_KEY));

/* ---------- копирование ---------- */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* пробуем запасной способ */ }
  try {
    const ta = h('textarea', { value: text, readonly: true, style: 'position:fixed;left:-9999px;top:0;opacity:0' });
    document.body.append(ta);
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

let toastTimer;
function showToast(msg, cls, undoFn, ms) {
  const t = $('#toast');
  t.replaceChildren(h('span', { text: msg }), undoFn ? h('button', { class: 'tundo', type: 'button', onclick() { undoFn(); } }, 'Отменить') : null);
  t.className = 'show' + cls + (undoFn ? ' undo' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, ms);
}
function toast(msg, bad) { showToast(msg, bad ? ' bad' : '', null, 1300); }
const snapshot = () => JSON.stringify(state);
// «Отменить»: возвращает всю базу к состоянию до действия, пока не было других изменений
function toastUndo(msg, snap) {
  const seq = saveSeq;
  showToast(msg, '', () => {
    if (seq !== saveSeq) { toast('Отменить уже нельзя: после этого были другие изменения', true); return; }
    state = JSON.parse(snap);

  }, 6500);
}

async function copyItem(item, card) {
  if (!item.text) { toast('В шаблоне нет текста', true); return; }
  const out = await prepareTexts([item.text]);
  if (!out) return;                                   // отменили ввод полей
  const ok = await copyText(out[0]);
  if (ok) {
    toast('✓ Скопировано');
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 900);

    toast('Не удалось скопировать', true);
  }
}

/* ---------- окна ---------- */
const stack = [];
// Фон за окном: по умолчанию прокручивается; в настройках можно зафиксировать. Окно правки (с клавиатурой) фон фиксирует всегда.
function updateModalLock() {
  const lock = stack.length > 0 && (uiGet().lockbg || stack.some(m => m.box.classList.contains('editor')));
  document.body.classList.toggle('modal-lock', !!lock);
}
function openModal(build, opts) {
  const overlay = h('div', { class: 'overlay' });
  const box = h('div', { class: 'sheet' + (opts && opts.cls ? ' ' + opts.cls : ''), role: 'dialog', 'aria-modal': 'true' });
  overlay.append(box);
  const api = {
    box,
    close() { overlay.remove(); const i = stack.indexOf(api); if (i >= 0) stack.splice(i, 1); updateModalLock(); },
    dismiss() { api.close(); }

  overlay.addEventListener('mousedown', e => { if (e.target === overlay) api.dismiss(); });
  overlay.addEventListener('touchmove', e => { if (e.target === overlay && document.body.classList.contains('modal-lock')) e.preventDefault(); }, { passive: false });
  stack.push(api);

}
document.addEventListener('keydown', e => {

const btn = (label, fn, kind, disabled) =>

        h('h2', { text: title }),

    openModal((box, api) => {

function openEditor(heading, base, tab, onSave) {
  openModal((box, api) => {

    // Можно ли поставить шаблон в строку с предыдущим, если он будет в группе gid
    const inlineInfo = gid => {
      if (base.archived) return { can: false, checked: false, why: 'шаблон в архиве' };
      const fav = !!base.fav;
      if (base.id && (base.group || null) === gid) {

          if (pos > 0) return { can: true, checked: true };
          if (ri === 0) return { can: false, checked: false, why: 'нет предыдущего шаблона' };
          if (rows[ri - 1].length + myRow.length > MAX_ROW) return { can: false, checked: false, why: 'в предыдущей строке уже слишком много' };

    const baseChecked = chk.checked;

    // группа и «в строку» спрятаны под одной строкой — так больше места под текст, особенно при открытой клавиатуре
    const extra = h('div', { class: 'ed-extra', hidden: true },
      h('label', { class: 'lbl', text: 'Группа' }), sel,
      h('label', { class: 'chk' }, chk, h('span', { text: 'В строку с предыдущим (до ' + MAX_ROW + ' в строке)' })), chkHint,
      h('p', { class: 'tmeta', style: 'margin:2px 0 0', text: 'В тексте можно писать {дата}, {время}, {?Поле} — при копировании подставится или спросится (меню ⋮ → «Подстановки»).' }));
    const more = h('button', { class: 'ed-more', type: 'button', onclick() { extra.hidden = !extra.hidden; refreshMore(); } });
    const refreshMore = () => {
      const gid = curGroup(), g = gid ? gById(tab, gid) : null;
      more.textContent = 'Группа: ' + (g ? groupPath(tab, g) : 'без группы') +
        (chk.checked && !chk.disabled ? ' · в строке с предыдущим' : '') + (extra.hidden ? '  ▾' : '  ▴');
    };

    chk.addEventListener('change', refreshMore);

    sel.addEventListener('change', async () => {
      if (sel.value !== '__new') { prev = sel.value; applyInfo(inlineInfo(curGroup()), true); refreshMore(); return; }
      const name = await promptName('Новая группа', '', 'Название группы');

    };
    api.dismiss = async () => {
      if (!dirty()) { api.close(); return; }

        title: 'Есть несохранённые изменения',
        message: 'Что сделать с изменениями?',
        buttons: [
          { label: 'Сохранить', value: 'save', kind: 'primary' },

        btn('Сохранить', doSave, 'primary')));
    // у существующего шаблона курсор в тексте; у нового — по настройке («Оформление и размеры» → «Новый шаблон»)

const curTab = () => state.tabs.find(t => t.id === state.active) || state.tabs.find(t => !t.archived) || state.tabs[0] || null;

function renderTabs() {

  const shown = state.tabs.filter(t => !t.archived || (tab && !state.special && t.id === tab.id));

// маленькое выпадающее меню: быстрый переход на любую вкладку
function tabsJump() {
  const old = document.querySelector('.tabmenu');
  if (old) { old._close(); return; }
  const anchor = $('#tabsJump'), r = anchor.getBoundingClientRect(), cur = curTab();
  const list = state.tabs.filter(t => !t.archived || (cur && !state.special && t.id === cur.id));
  let menu;
  const close = () => {
    menu.remove();
    document.removeEventListener('pointerdown', outside, true);
    document.removeEventListener('keydown', onKey, true);
    window.removeEventListener('resize', close);
    window.removeEventListener('scroll', close, true);
  };
  const outside = e => { if (!menu.contains(e.target) && e.target !== anchor) close(); };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); anchor.focus(); } };
  const go = fn => () => { close(); fn(); query = ''; $('#q').value = ''; save(); renderTabs(); renderList(); };

  menu = h('div', { class: 'tabmenu', role: 'menu' },

    list.map(t => item((t.archived ? '🗄 ' : '') + t.name, !state.special && cur && t.id === cur.id, () => { state.special = false; state.active = t.id; })));
  menu._close = close;
  menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 220)) + 'px';

// Шаблон с inline=true встаёт в строку с предыдущим (до MAX_ROW в строке, только среди одинаковых по «избранности»)

function layoutFolderColumns() {

  if (!document.body.classList.contains('cols-folders') || sortMode || state.special) return;
  const cols = Math.round(clampN(uiGet().cols, 2, 4, 2));
  const kids = [...box.children];
  const isRow = c => c.classList.contains('row') || c.classList.contains('mrow');
  box.replaceChildren();
  let run = [], loose = null;
  const flush = () => {
    if (!run.length) return;
    const columns = Array.from({ length: cols }, () => h('div', { class: 'col' }));
    const per = Math.ceil(run.length / cols), vert = uiGet().gridflow === 'col';
    run.forEach((t, i) => columns[vert ? Math.min(cols - 1, Math.floor(i / per)) : i % cols].append(t));
    box.append(h('div', { class: 'colsrow' }, ...columns));
    run = []; loose = null;
  };
  kids.forEach(c => {
    if (isRow(c)) { if (!loose) { loose = h('div', { class: 'tile' }); run.push(loose); } loose.append(c); }

// Сетка карточек «по столбцам»: подряд идущие карточки складываются вниз по первому столбцу, затем по второму и т.д.

function renderListInner() {

        if (!hits.length) return;
        box.append(tabHead(tb, hits.length));
        appendArchived(box, tb, match, true, true);

      const found = tb.items.filter(i => !i.archived && match(i));

      const arch = searchArchive ? archAll : [];

    box.append(q

      : emptyBlock('В этой вкладке пока пусто', 'Добавьте первый шаблон.', '+ Добавить шаблон', () => addItem()));
    if (q && !searchArchive && archMatches) box.append(archiveHint(archMatches));
  }
  if (!q && (uiGet().archShow !== false || tab.archived)) archiveSection(box, tab);
}

/* ---------- перетаскивание ---------- */
// handle — «ручка», el — перетаскиваемая строка, getSibs() — строки, между которыми можно двигать (в порядке DOM)
// События слушаем на document и захватываем указатель на body: при перестановке элемента в DOM
// захват с самой ручки теряется, и перетаскивание «зависало».
function attachDrag(handle, el, getSibs, onDrop, autoscroll, onMove, onStart, onEnd, onHover) {
  handle.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    e.preventDefault();
    const pid = e.pointerId, sx = e.clientX, body = document.body;
    try { body.setPointerCapture(pid); } catch (err) {}
    if (onStart) {
      // onStart может изменить высоту страницы (например, свернуть группы) — удерживаем элемент под пальцем
      const t0 = el.getBoundingClientRect().top;
      onStart();
      const t1 = el.getBoundingClientRect().top;
      if (t1 !== t0) window.scrollBy(0, t1 - t0);
    }
    const grab = e.clientY - el.getBoundingClientRect().top;
    let y = e.clientY, dx = 0, raf = 0;
    const prevSel = body.style.userSelect;
    body.style.userSelect = 'none'; body.style.webkitUserSelect = 'none';
    el.classList.add('dragging');

    const place = () => {
      el.style.transform = 'none';
      const nat = el.getBoundingClientRect();
      const desired = y - grab;
      // опорная точка — у «ручки» (для высоких элементов не центр); порог — от верхнего края соседа, одинаковый
      // в обе стороны, поэтому перестановка не «дребезжит» даже у групп разной высоты
      const ref = desired + Math.min(nat.height / 2, 40);
      const sibs = getSibs(), i = sibs.indexOf(el);
      const next = sibs[i + 1], prev = sibs[i - 1];
      // пока указатель над другой группой, соседей по своей группе не переставляем
      const allow = onHover ? onHover(y) !== false : true;
      if (allow && next) { const r = next.getBoundingClientRect(); if (ref > r.top + Math.min(r.height / 2, 40)) next.after(el); }
      if (allow && prev) { const r = prev.getBoundingClientRect(); if (ref < r.top + Math.min(r.height / 2, 40)) prev.before(el); }
      el.style.transform = 'none';

      if (autoscroll) {

        const hdr = document.querySelector('.top');
        const topEdge = (hdr ? hdr.getBoundingClientRect().bottom || 0 : 0) + 70;
        const botEdge = window.innerHeight - 70;
        let v = 0;
        if (y < topEdge) v = -Math.min(1, (topEdge - y) / 100) * 22;
        else if (y > botEdge) v = Math.min(1, (y - botEdge) / 100) * 22;

      cancelAnimationFrame(raf);

      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', cancel);
      try { body.releasePointerCapture(pid); } catch (err) {}
      body.style.userSelect = prevSel; body.style.webkitUserSelect = '';
      el.classList.remove('dragging'); el.style.transform = '';
      if (onHover) onHover(null);
      if (onEnd) onEnd();
    };
    const up = ev => { if (ev.pointerId !== pid) return; stop(); onDrop(getSibs(), dx, y); };
    const cancel = ev => { if (ev.pointerId !== pid) return; stop(); onDrop(null, 0); };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', cancel);
    raf = requestAnimationFrame(loop);
  });
}
// ids — новый порядок шаблонов одной секции (группа + избранность); места в массиве сохраняются
function applyOrder(tab, ids) {
  const set = new Set(ids), slots = [];
  tab.items.forEach((it, i) => { if (set.has(it.id)) slots.push(i); });
  const byId = new Map(tab.items.map(i => [i.id, i]));
  slots.forEach((slot, k) => { tab.items[slot] = byId.get(ids[k]); });
}
function setSort(on) {

  sortMode = on; sortSel.clear();
  document.body.classList.toggle('sortmode', on);
  $('#sortBtn').classList.toggle('on', on);
  $('#sortbar').hidden = !on;
  document.querySelector('.search').hidden = on;
  if (on) { query = ''; $('#q').value = ''; scope = 'tab'; syncScope(); }

function updateSortHint() {
  const sp = $('#sortbar span'); if (!sp) return;
  if (!sp.dataset.def) sp.dataset.def = sp.textContent;
  const marked = sortSel.size && !state.special ? ' Отмечено строк: ' + sortSel.size + ' — тяните любую отмеченную за ⠿, перенесутся все. Нажмите на отмеченную, чтобы снять.' : '';
  sp.textContent = (state.special ? 'Тяните за ⠿, чтобы изменить порядок избранного.' : sp.dataset.def + ' Нажатие на шаблон — отметить несколько для общего переноса.') + marked;

const DRAG_X = 40; // сдвиг по горизонтали, после которого меняется режим строки

// Группа (элемент .sgroup, самая вложенная) под указателем в режиме сортировки
function groupAtY(y) {
  let best = null, bestDepth = -1;
  document.querySelectorAll('#list .sgroup').forEach(w => {
    const r = w.getBoundingClientRect();
    if (y < r.top || y > r.bottom) return;
    let d = 0, q = w.parentElement;
    while (q && q.id !== 'list') { if (q.classList.contains('sgroup')) d++; q = q.parentElement; }
    if (d > bestDepth) { best = w; bestDepth = d; }
  });

}
// куда «упадёт» перетаскиваемая строка: { gid, el } или null, если указатель вне списка

  const list = $('#list'), r = list.getBoundingClientRect();

}
// Положение групп относительно строк шаблонов по итоговому порядку seq: [{block:true, head}, {g}]
function applyAnchors(tab, seq) {
  let last = '';
  seq.forEach((n, i) => {
    if (n.block) { last = n.head; return; }
    const g = gById(tab, n.g); if (!g) return;
    if (seq.slice(i + 1).some(x => x.block)) g.after = last; else delete g.after;   // в самом конце — положение «по умолчанию»

const sortNode = c => (c.classList.contains('sblock') ? { block: true, head: c.dataset.id } : { g: c.dataset.id });
const isSortKid = c => c.classList.contains('sblock') || c.classList.contains('sgroup');
const rowsOf = block => [...block.children].filter(c => c.classList.contains('srow'));
// Сохраняет порядок контейнера (корень или группа) так, как он виден на экране: шаблоны, группы и их взаимное положение
function commitContainer(tab, cont) {
  const kids = [...cont.children].filter(isSortKid);
  applyOrder(tab, kids.filter(c => c.classList.contains('sblock')).flatMap(b => rowsOf(b).map(r => r.dataset.id)));
  applyAnchors(tab, kids.map(sortNode));
  const gids = kids.filter(c => c.classList.contains('sgroup')).map(c => c.dataset.id), slots = [];
  tab.groups.forEach((x, n) => { if (gids.includes(x.id)) slots.push(n); });
  const byId = new Map(tab.groups.map(x => [x.id, x]));
  slots.forEach((slot, n) => { tab.groups[slot] = byId.get(gids[n]); });
}
// перенос строки шаблонов (ids) в другую группу / в «без группы» (gid = null); позиция — по указателю y
function crossMove(tab, ids, gid, y, block, extra, heads) {
  const snap = snapshot();
  sortSel.clear();
  const items = ids.map(id => tab.items.find(x => x.id === id)).filter(Boolean);
  if (!items.length) { renderList(); return; }
  const head = items[0];
  const w = gid ? document.querySelector('#list .sgroup[data-id="' + gid + '"]') : null;
  const cont = gid ? (w && [...w.children].find(c => c.classList.contains('sgbody'))) : $('#list');
  const kids = cont ? [...cont.children].filter(c => isSortKid(c) && c !== block && !(extra && extra.includes(c))) : [];
  let k = kids.length;
  for (let i = 0; i < kids.length; i++) {
    const r = kids[i].getBoundingClientRect();
    if (y < r.top + Math.min(r.height / 2, 40)) { k = i; break; }
  }
  tab.items = tab.items.filter(x => !items.includes(x));
  items.forEach((it, n) => { it.group = gid; it.archByGroup = false; if (n === 0 || (heads && heads.includes(it.id))) it.inline = false; });
  const sec = (gid || '') + '|' + (head.fav ? 1 : 0);
  const nextBlock = kids.slice(k).find(c => c.classList.contains('sblock') && c.dataset.sec === sec);
  let idx = tab.items.length;
  if (nextBlock) { const bi = tab.items.findIndex(x => x.id === nextBlock.dataset.id); if (bi >= 0) idx = bi; }

  const g = gid ? gById(tab, gid) : null;

}

function sortBlock(tab, row, parent) {
  const head = row[0];
  const sec = (head.group || '') + '|' + (head.fav ? 1 : 0);
  const block = h('div', { class: 'sblock' + (row.length > 1 ? ' multi' : ''), 'data-id': head.id, 'data-sec': sec });
  const siblings = () => [...parent.children].filter(c => c.style.display !== 'none' && (c.classList.contains('sgroup') || (c.classList.contains('sblock') && c.dataset.sec === sec)));
  if (sortSel.has(head.id)) block.classList.add('marked');
  let packing = false;
  row.forEach((it, idx) => {
    const hasTitle = !!it.title.trim();
    const mark = idx > 0 ? '↳ ' : '';
    const handle = h('button', { class: 'handle', type: 'button', 'aria-label': 'Перетащить: ' + label(it) }, '⠿');
    const el = h('div', { class: 'srow' + (idx > 0 ? ' chained' : '') + (it.fav ? ' fav' : ''), 'data-id': it.id },
      handle,
      h('div', { class: 'sbody' },
        hasTitle ? h('span', { class: 'ttl', text: mark + it.title }) : null,
        h('span', { class: 'pre', text: (hasTitle ? '' : mark) + it.text })),
      h('span', { class: 'shint', 'aria-hidden': 'true' }));
    block.append(el);

    if (idx === 0) {
      // нажатие на текст — отметить строку (для переноса нескольких сразу)
      el.querySelector('.sbody').addEventListener('click', () => {
        if (sortSel.has(head.id)) sortSel.delete(head.id); else sortSel.add(head.id);
        block.classList.toggle('marked', sortSel.has(head.id));
        updateSortHint();
      });
      // тянем всю строку
      const origin = head.group || null;
      attachDrag(handle, block, siblings, (sibs, dx, y) => {
        if (!sibs) { renderList(); return; }
        if (packing) {
          const blocks = [...document.querySelectorAll('#list .sblock.marked')];
          const ids = blocks.flatMap(b => rowsOf(b).map(r => r.dataset.id));
          const tgp = dropTarget(y);
          const host = block.parentElement;
          const gid = tgp ? tgp.gid : (host.classList.contains('sgbody') ? host.parentElement.dataset.id : null);
          crossMove(tab, ids, gid, y, block, blocks, blocks.map(b => b.dataset.id));
          return;
        }
        const tg = dropTarget(y);
        if (tg && tg.gid !== origin) { crossMove(tab, rowsOf(block).map(r => r.dataset.id), tg.gid, y, block); return; }
        if (dx >= DRAG_X) {
          const kids = [...parent.children].filter(c => c.classList.contains('sblock') || c.classList.contains('sgroup'));
          const prev = kids[kids.indexOf(block) - 1];
          if (!prev || !prev.classList.contains('sblock') || prev.dataset.sec !== block.dataset.sec || rowsOf(prev).length + rowsOf(block).length > MAX_ROW) {
            toast('Нельзя: нет предыдущего шаблона рядом или в строке уже ' + MAX_ROW, true);
          } else head.inline = true;
        }
        commitContainer(tab, parent);
        save(); renderList();
      }, true, dx => { if (!packing) block.classList.toggle('pre-join', dx >= DRAG_X); }, () => {
        const blocks = [...document.querySelectorAll('#list .sblock.marked')];
        packing = blocks.length > 1 && block.classList.contains('marked');
        if (packing) {
          block.dataset.pack = String(blocks.length); block.classList.add('packing');
          blocks.forEach(b => { if (b !== block) b.style.display = 'none'; });
        }

        document.querySelectorAll('.drop-target').forEach(n => n.classList.remove('drop-target'));
        if (y == null) return true;

        const ids = sibs.map(r => r.dataset.id);
        applyOrder(tab, ids);
        const members = ids.map(id => tab.items.find(x => x.id === id));
        members.forEach((m, i) => { m.inline = i > 0; });
        if (dx <= -DRAG_X) {

        }
        save(); renderList();
      }, true, dx => { el.classList.toggle('pre-alone', dx <= -DRAG_X); });
    }
  });

}

function renderSort(tab, box) {
  // содержимое контейнера в общем порядке: строки шаблонов и группы вперемешку
  const fill = (parentEl, gid, groups) => {
    const rows = layoutRows(sortedFor(tab, gid, () => true));
    containerEntries(rows, groups).forEach(e => {
      if (e.row) parentEl.append(sortBlock(tab, e.row, parentEl));
      else buildGroup(parentEl, e.g);

  };
  const buildGroup = (parentEl, g) => {
    const open = !g.collapsed;
    const handle = h('button', { class: 'handle', type: 'button', 'aria-label': 'Перетащить группу ' + g.name }, '⠿');
    const wrap = h('div', { class: 'sgroup gd' + Math.min(depthOf(tab, g), 3), 'data-id': g.id },
      h('div', { class: 'sghead' },
        handle,
        h('button', { class: 'sgtoggle', type: 'button', 'aria-expanded': String(open), onclick() { g.collapsed = !g.collapsed; save(); renderList(); } },
          h('span', { class: 'chev', text: open ? '▾' : '▸' }),

    if (open) {
      const body = h('div', { class: 'sgbody' });
      fill(body, g.id, childrenOf(tab, g.id).filter(c => !c.archived));
      if (!body.childElementCount) body.append(h('p', { class: 'gempty', text: 'В группе пока нет шаблонов' }));
      wrap.append(body);
    }
    parentEl.append(wrap);
    attachDrag(handle, wrap, () => [...parentEl.children].filter(c => c.classList.contains('sgroup') || c.classList.contains('sblock')), sibs => {
      if (!sibs) { renderList(); return; }
      commitContainer(tab, parentEl);
      save(); renderList();
    }, true);
  };
  fill(box, null, childrenOf(tab, null).filter(g => !g.archived));
  if (!box.childElementCount) box.append(emptyBlock('Сортировать нечего', 'В этой вкладке пока нет шаблонов.'));
}

/* ---------- действия с шаблонами ---------- */
const label = it => it.title || it.text.trim().split('\n')[0].slice(0, 40) || 'Без названия';

function reveal(tab, gid) {
  let g = gid && gById(tab, gid), k = 0;
  while (g && k++ < 10) { g.collapsed = false; g = g.parent ? gById(tab, g.parent) : null; }
}
function addItem(gid) {
  const tab = curTab(); if (!tab) return;
  openEditor('Новый шаблон', { title: '', text: '', group: gid || null }, tab, (title, text, group, inline) => {
    tab.items.push({ id: uid(), title, text, fav: false, inline: !!inline, mod: Date.now(), cr: Date.now(), pin: 0, group });
    reveal(tab, group);

}
function editItem(id) {
  const loc = locate(id); if (!loc) return;
  const { tab, it } = loc;
  openEditor('Редактирование', { id: it.id, fav: it.fav, archived: it.archived, title: it.title, text: it.text, group: it.group }, tab, (title, text, group, inline) => {

function dupItem(id) {

async function delItem(id) {

function moveGroupTo(tab, g, pid) {

function groupParentPicker(gid) {
  const tab = curTab(); const g = tab && gById(tab, gid); if (!g) return;
  const bad = new Set([g.id, ...descendantsOf(tab, g).map(x => x.id)]);
  const hgt = heightOf(tab, g);
  const cand = orderedGroups(tab).filter(x => !bad.has(x.id) && x.id !== g.parent && depthOf(tab, x) + 1 + hgt <= MAX_DEPTH);
  openModal((box, api) => {
    box.append(h('h2', { text: 'Переместить группу «' + g.name + '»' }),

        btn('Отмена', () => api.close(), 'ghost')));

// ---- архив группы (вместе с подгруппами) ----
function archiveGroupCore(tab, g) {
  const sub = [g, ...descendantsOf(tab, g)];
  const ids = new Set(sub.map(x => x.id));
  sub.forEach((x, k) => { if (!x.archived) { x.archived = true; x.archByParent = k > 0; } });
  tab.items.forEach(it => {
    if (!ids.has(it.group)) return;
    it.inline = false;
    if (!it.archived) { it.archived = true; it.archByGroup = true; }
  });
}
function archiveGroup(tab, g) {
  const snap = snapshot();
  archiveGroupCore(tab, g);
  save(); renderList(); toastUndo('Группа «' + g.name + '» перенесена в архив', snap);
}
// Возвращает группу g (или один шаблон onlyItem из неё). Если родительские группы тоже в архиве, возвращается вся цепочка к g;
// всё остальное, что было заархивировано вместе с ними, остаётся в архиве «само по себе».
function unarchiveGroup(tab, g, onlyItem) {
  const chain = [];
  for (let a = g.parent && gById(tab, g.parent); a && a.archived; a = a.parent && gById(tab, a.parent)) chain.push(a);
  const top = chain.length ? chain[chain.length - 1] : g;
  const scope = [top, ...descendantsOf(tab, top)];
  const scopeIds = new Set(scope.map(x => x.id));
  const live = new Set([g.id, ...chain.map(x => x.id)]);
  const wake = new Set([g.id]);              // группы под g, которые оживают вместе с ней
  if (!onlyItem) {
    const walk = x => childrenOf(tab, x.id).forEach(c => { if (c.archived && c.archByParent) { wake.add(c.id); walk(c); } });
    walk(g);
  }
  scope.forEach(x => {
    if (live.has(x.id) || wake.has(x.id)) { x.archived = false; x.archByParent = false; }
    else if (x.archived) x.archByParent = false;
  });
  tab.items.forEach(it => {
    if (!it.archByGroup || !scopeIds.has(it.group)) return;
    it.archByGroup = false;                  // остаётся в архиве, но уже по отдельности
    if (onlyItem ? it === onlyItem : wake.has(it.group)) { it.archived = false; it.inline = false; }
  });
  if (onlyItem) { onlyItem.archived = false; onlyItem.archByGroup = false; onlyItem.inline = false; }
  reveal(tab, g.id);
  save(); renderList();
}
// Вернуть ОДИН шаблон из архивной группы: группа становится активной, остальные её шаблоны остаются в архиве
function restoreOneFromGroup(tab, g, it) {
  unarchiveGroup(tab, g, it);
  toast('Шаблон возвращён в группу «' + g.name + '», остальные остались в архиве');
}
function restoreGroup(tab, g) {
  unarchiveGroup(tab, g, null);
  toast('Группа «' + g.name + '» возвращена из архива');
}

// ---- удаление группы ----
async function delGroup(gid) {
  const tab = curTab(); const g = tab && gById(tab, gid);
  if (!g) return;
  const desc = descendantsOf(tab, g);
  const ids = new Set([g.id, ...desc.map(x => x.id)]);
  const n = tab.items.filter(i => ids.has(i.group)).length;
  const what = 'шаблонов: ' + n + (desc.length ? ', подгрупп: ' + desc.length : '');
  let r;
  if (!n && !desc.length) {
    r = await confirmDialog({
      title: 'Удалить группу?', message: 'Группа «' + g.name + '» пуста и будет удалена.',
      buttons: [{ label: 'Удалить', value: 'keep', kind: 'danger' }, { label: 'Отмена', value: 'no' }], cancelValue: 'no'
    });
  } else {
    r = await confirmDialog({
      title: 'Удалить группу «' + g.name + '»?',
      message: 'В группе (' + what + '). Что с ними сделать? Удалённое попадает в корзину на 30 дней.',
      buttons: [
        { label: 'Удалить только группу, содержимое оставить', value: 'keep', kind: 'danger' },
        { label: 'Удалить группу вместе со всем содержимым', value: 'all', kind: 'danger' },
        { label: 'Отмена', value: 'no' }
      ], cancelValue: 'no'
    });
  }
  if (r === 'no') return;
  const snap = snapshot();
  if (r === 'all') {
    const gone = tab.items.filter(i => ids.has(i.group));
    toTrash({ kind: 'group', tabId: tab.id, tabName: tab.name, group: g, subs: desc, items: gone });
    tab.items = tab.items.filter(i => !ids.has(i.group));
    tab.groups = tab.groups.filter(x => !ids.has(x.id));
  } else {
    // содержимое поднимается на уровень выше
    const up = g.parent || null;
    tab.items.forEach(i => { if (i.group === gid) { i.group = up; i.archByGroup = false; } });
    childrenOf(tab, gid).forEach(c => { c.parent = up; delete c.after; });
    tab.groups = tab.groups.filter(x => x.id !== gid);
  }
  save(); renderList(); toastUndo(r === 'all' ? 'Перемещено в корзину' : 'Группа удалена', snap);
}

// ---- копии и перенос поддерева групп ----
const cloneItems = (items, gid) => items.map(i => ({ id: uid(), title: i.title, text: i.text, fav: i.fav, inline: i.inline, archived: !!i.archived, archByGroup: !!i.archByGroup, mod: i.mod || 0, cr: Date.now(), pin: 0, group: gid }));
// копирует группу g вместе с подгруппами и шаблонами в dest; возвращает корень копии
function cloneSubtree(tab, g, dest, rootName, rootParent, insertAt) {
  const sub = [g, ...descendantsOf(tab, g)];
  const map = new Map(sub.map(x => [x.id, uid()]));
  const made = sub.map((x, k) => ({
    id: map.get(x.id), name: k === 0 ? rootName : x.name, collapsed: false,
    archived: !!x.archived, archByParent: !!x.archByParent, parent: k === 0 ? rootParent : map.get(x.parent)
  }));
  if (insertAt != null) { dest.groups.splice(insertAt, 0, made[0]); dest.groups.push(...made.slice(1)); }
  else dest.groups.push(...made);
  tab.items.filter(i => map.has(i.group)).forEach(i => dest.items.push({
    id: uid(), title: i.title, text: i.text, fav: i.fav, inline: i.inline, archived: !!i.archived, archByGroup: !!i.archByGroup, mod: i.mod || 0, cr: Date.now(), pin: 0, group: map.get(i.group)
  }));
  return made[0];
}
function dupGroup(gid) {
  const tab = curTab(); if (!tab) return;
  const g = gById(tab, gid); if (!g) return;
  cloneSubtree(tab, g, tab, g.name + ' (копия)', g.parent || null, tab.groups.indexOf(g) + 1);
  save(); renderList(); toast('Группа продублирована');
}
function tabPicker(title, tabs, onPick) {
  openModal((box, api) => {
    box.append(h('h2', { text: title }),
      h('div', { class: 'btns' },
        tabs.map(t => btn(t.name, () => { api.close(); onPick(t); })),
        btn('Отмена', () => api.close(), 'ghost')));
  });
}
function transferGroup(gid, mode) {
  const src = curTab(); if (!src) return;
  const g = gById(src, gid); if (!g) return;
  const others = state.tabs.filter(t => t !== src && !t.archived);
  if (!others.length) { toast('Нет других вкладок — сначала создайте вкладку', true); return; }
  const move = mode === 'move';
  tabPicker(move ? 'Перенести группу в вкладку' : 'Копировать группу в вкладку', others, dest => {
    const snap = snapshot();
    if (move) {
      const sub = [g, ...descendantsOf(src, g)];
      const ids = new Set(sub.map(x => x.id));
      const items = src.items.filter(x => ids.has(x.group));
      src.groups = src.groups.filter(x => !ids.has(x.id));
      src.items = src.items.filter(x => !ids.has(x.group));
      g.collapsed = false; g.parent = null; delete g.after;
      dest.groups.push(...sub);
      dest.items.push(...items);
    } else {

/* ---------- выбор нескольких шаблонов и групп: массовые действия ---------- */
function selIsGroupSelected(tab, g) {
  for (let x = g, k = 0; x && k < 10; x = x.parent ? gById(tab, x.parent) : null, k++) if (sel.has('g:' + x.id)) return true;
  return false;
}
// '' — не выбран, 'own' — выбран сам, 'inh' — выбран вместе с группой
function itemSelState(item) {
  if (sel.has('i:' + item.id)) return 'own';
  const loc = locate(item.id);
  if (loc && item.group && selIsGroupSelected(loc.tab, gById(loc.tab, item.group))) return 'inh';
  return '';
}
function toggleItemSel(item) {
  if (itemSelState(item) === 'inh') { toast('Выбрана вся группа — снимите выбор у группы', true); return; }
  const k = 'i:' + item.id;
  if (sel.has(k)) sel.delete(k); else sel.add(k);
  renderList();
}
function toggleGroupSel(g) {
  const tab = curTab(); if (!tab) return;
  const k = 'g:' + g.id;
  if (!sel.has(k) && selIsGroupSelected(tab, g)) { toast('Выбрана родительская группа', true); return; }
  if (sel.has(k)) sel.delete(k);
  else {
    sel.add(k);
    const ids = new Set(descendantsOf(tab, g).map(x => x.id));
    ids.forEach(id => sel.delete('g:' + id));
    tab.items.forEach(it => { if (it.group === g.id || ids.has(it.group)) sel.delete('i:' + it.id); });
  }
  renderList();
}
// выбранное: группы — только верхние из выбранных, шаблоны — не входящие в выбранные группы
function selectedEntities() {
  const groups = [], items = [];
  state.tabs.forEach(tab => {
    tab.groups.forEach(g => {
      if (!sel.has('g:' + g.id)) return;
      const anc = g.parent && gById(tab, g.parent);
      if (!(anc && selIsGroupSelected(tab, anc))) groups.push({ tab, g });
    });
    tab.items.forEach(it => {
      if (!sel.has('i:' + it.id)) return;
      if (it.group && selIsGroupSelected(tab, gById(tab, it.group))) return;
      items.push({ tab, it });
    });
  });
  return { groups, items };
}

function trashItemNow(tab, it) {

function trashGroupNow(tab, g) {

  toTrash({ kind: 'group', tabId: tab.id, tabName: tab.name, group: g, subs: desc, items: tab.items.filter(i => ids.has(i.group)) });

// выбор места назначения: вкладка → группа (или «без группы» / «верхний уровень»)
function pickDestination(e, verb) {
  return new Promise(resolve => {
    const hasGroups = e.groups.length > 0;
    const hgt = hasGroups ? Math.max(...e.groups.map(({ tab, g }) => heightOf(tab, g))) : 0;
    const bad = new Set();
    e.groups.forEach(({ tab, g }) => { bad.add(g.id); descendantsOf(tab, g).forEach(x => bad.add(x.id)); });
    openModal((box, api) => {
      api.dismiss = () => { api.close(); resolve(null); };
      let stage = 'tab', chosen = null;
      const draw = () => {
        if (stage === 'tab') {
          const tabs = state.tabs.filter(t => !t.archived), here = state.special ? null : curTab();
          box.replaceChildren(h('h2', { text: verb + ': куда?' }),
            h('div', { class: 'btns' },
              here ? btn('📁 В папку текущей вкладки «' + here.name + '»', () => { chosen = here; stage = 'group'; draw(); }, 'primary') : null,
              here && tabs.length > 1 ? h('p', { class: 'tmeta', style: 'margin:2px 0', text: 'Или в другую вкладку:' }) : null,
              tabs.filter(t => t !== here).map(t => btn(t.name, () => { chosen = t; stage = 'group'; draw(); })),
              btn('Отмена', api.dismiss, 'ghost')));
        } else {
          const t = chosen;
          const cand = orderedGroups(t).filter(x => !bad.has(x.id) && (!hasGroups || depthOf(t, x) + 1 + hgt <= MAX_DEPTH));
          box.replaceChildren(h('h2', { text: verb + ' в «' + t.name + '»' }),
            h('div', { class: 'btns' },
              btn(hasGroups ? 'На верхний уровень' : 'Без группы', () => { api.close(); resolve({ tab: t, gid: null }); }, 'primary'),
              cand.map(x => btn(groupPath(t, x), () => { api.close(); resolve({ tab: t, gid: x.id }); })),
              btn('← Другая вкладка', () => { stage = 'tab'; draw(); }),
              btn('Отмена', api.dismiss, 'ghost')));
        }
      };
      draw();
    });
  });
}

async function delTab(id, after) {

  const ok = await confirmDialog({

      : 'Вкладка «' + t.name + '» будет удалена.',

function exportData() {
  const data = { app: 'my-templates', version: 1, appVersion: APP_VERSION, exportedAt: new Date().toISOString(), active: state.active, tabs: state.tabs, trash: state.trash };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = 'shablony-' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '.json';
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  { const m = readMeta(); m.lastExport = Date.now(); m.snoozeUntil = 0; writeMeta(m); }
  toast('Экспорт готов'); updateRemind();
}
// Читаемый текстовый файл со всеми шаблонами (для просмотра и печати; для резервной копии используйте обычный экспорт)
function buildText(tabs) {
  const L = ['Мои шаблоны — экспорт от ' + fmtDateTime(Date.now()), ''];
  const emit = items => items.forEach(it => {
    if (it.title) L.push('▸ ' + it.title);
    L.push(it.text, '----');
  });
  tabs.forEach(tab => {
    L.push('════════ ' + tab.name + (tab.archived ? ' (вкладка в архиве)' : '') + ' ════════', '');
    const everything = !!tab.archived;                       // в архивной вкладке показываем всё как есть
    const act = gid => (everything ? allFor : sortedFor)(tab, gid, () => true);
    const loose = act(null);
    if (loose.length) { if (tab.groups.length) L.push('[Без группы]'); emit(loose); L.push(''); }
    orderedGroups(tab, true).forEach(g => {
      const items = g.archived ? allFor(tab, g.id, () => true) : act(g.id);
      if (!items.length) return;
      L.push('[' + groupPath(tab, g) + (g.archived ? ' — группа в архиве' : '') + ']');
      emit(items); L.push('');
    });
    if (!everything) {                                        // шаблоны, заархивированные по отдельности
      const secs = [];
      const aLoose = archivedFor(tab, null, () => true);
      if (aLoose.length) secs.push(['Без группы', aLoose]);
      orderedGroups(tab, true).filter(g => !g.archived).forEach(g => {
        const arr = archivedFor(tab, g.id, () => true);
        if (arr.length) secs.push([groupPath(tab, g), arr]);
      });
      secs.forEach(([name, items]) => { L.push('[Архив: ' + name + ']'); emit(items); L.push(''); });
    }
  });
  return L.join('\n');
}

const countItems = s => s.tabs.reduce((n, t) => n + t.items.length, 0);
// число составных строк (из 2–4 шаблонов) во всей базе
function countRows(st) {
  let n = 0;
  st.tabs.forEach(tab => {
    [null, ...tab.groups.map(g => g.id)].forEach(gid => {
      [true, false].forEach(fav => {
        const items = tab.items.filter(i => !i.archived && i.group === gid && i.fav === fav);
        n += layoutRows(items).filter(r => r.length > 1).length;
      });
    });
  });
  return n;
}

const sameName = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();

// Объединение: вкладки и группы сопоставляются по названию, одинаковые шаблоны (группа + название + текст) не дублируются.
// Составные строки переносятся: и для новых шаблонов, и для уже имеющихся — если они в базе стоят рядом так же, как в файле.
// onConflict(info) вызывается для шаблона из файла, который «почти совпал» с имеющимся в той же группе:
//   kind 'text'  — название то же, текст другой;
//   kind 'title' — текст тот же, название другое (в том числе у одного из шаблонов названия нет).
// Возвращает 'mine' (оставить свой), 'theirs' (взять из файла: текст или название) или 'both' (добавить и этот).
const sameText = (a, b) => a.trim() === b.trim();
function mergeInto(target, incoming, onConflict) {
  const stat = { tabs: 0, groups: 0, added: 0, dups: 0, rows: 0, kept: 0, replaced: 0, both: 0 };
  incoming.tabs.forEach(st => {
    let dt = target.tabs.find(t => sameName(t.name, st.name));
    if (!dt) { dt = { id: uid(), name: st.name, groups: [], items: [], archived: !!st.archived }; target.tabs.push(dt); stat.tabs++; }
    const gmap = new Map(), garch = new Map();
    const order = [], placed = new Set();      // родительские группы раньше дочерних
    const place = sg => {
      if (placed.has(sg.id)) return;
      const par = sg.parent && st.groups.find(x => x.id === sg.parent);
      if (par) place(par);
      placed.add(sg.id); order.push(sg);
    };
    st.groups.forEach(place);
    order.forEach(sg => {
      const pid = sg.parent ? (gmap.get(sg.parent) || null) : null;
      let dg = dt.groups.find(g => (g.parent || null) === pid && sameName(g.name, sg.name));
      if (!dg) {
        dg = { id: uid(), name: sg.name, collapsed: false, archived: !!sg.archived, archByParent: !!sg.archByParent && !!(pid && garch.get(pid)), parent: pid };
        dt.groups.push(dg); stat.groups++;
      }
      gmap.set(sg.id, dg.id); garch.set(dg.id, !!dg.archived);
    });
    const used = new Set();        // шаблоны, уже сопоставленные в этом импорте (каждый — один раз)
    const prevMapped = new Map();  // секция источника → шаблон в базе, соответствующий предыдущему шаблону файла
    st.items.forEach(si => {
      const dgid = si.group ? (gmap.get(si.group) || null) : null;
      const key = (si.group || '') + '|' + (si.fav ? 1 : 0);
      let x = dt.items.find(t => !used.has(t) && t.group === dgid && t.title === si.title && t.text === si.text);
      let isNew = !x, title = si.title, counted = false;
      if (isNew && onConflict) {
        let c = null, kind = '';
        if (si.title.trim()) {
          c = dt.items.find(t => !used.has(t) && t.group === dgid && t.title.trim() && sameName(t.title, si.title) && t.text !== si.text);
          if (c) kind = 'text';
        }
        if (!c && si.text.trim()) {
          c = dt.items.find(t => !used.has(t) && t.group === dgid && sameText(t.text, si.text) && !sameName(t.title, si.title));
          if (c) kind = 'title';
        }
        if (c) {
          const dec = onConflict({
            srcId: si.id, kind, tabName: dt.name,
            groupLabel: dgid ? groupPath(dt, gById(dt, dgid)) : 'без группы',
            title: si.title, mineTitle: c.title, theirTitle: si.title,
            mineText: c.text, theirText: si.text, mineMod: c.mod || 0, theirMod: si.mod || 0
          });
          if (dec === 'mine') { used.add(c); prevMapped.set(key, c); stat.kept++; return; }
          if (dec === 'theirs') {
            if (kind === 'text') c.text = si.text; else c.title = si.title;
            c.mod = si.mod || Date.now(); x = c; isNew = false; counted = true; stat.replaced++;
          } else {
            if (kind === 'text') title = si.title + ' (из файла)';
            stat.both++;
          }
        }
      }
      if (isNew) {
        x = { id: uid(), title, text: si.text, fav: si.fav, inline: false, archived: !!si.archived, archByGroup: !!si.archByGroup && !!garch.get(dgid), mod: si.mod || 0, cr: Date.now(), pin: si.pin || 0, group: dgid };
        dt.items.push(x); stat.added++;
      } else if (!counted) stat.dups++;
      used.add(x);
      if (si.inline && !x.inline && !x.archived) {
        // в строку с предыдущим — только если предыдущий шаблон файла действительно стоит прямо перед этим в базе
        const list = dt.items.filter(t => !t.archived && t.group === dgid && t.fav === x.fav);
        const pred = list[list.indexOf(x) - 1];
        if (pred && pred === prevMapped.get(key)) { x.inline = true; if (!isNew) stat.rows++; }
      }
      prevMapped.set(key, x);
    });
  });
  if (!target.active && target.tabs[0]) target.active = target.tabs[0].id;
  return stat;
}

// Предложенный выбор. Текст другой: побеждает более поздний по дате изменения, при неизвестных датах — оставляем оба.
// Название другое: непустое название лучше пустого; иначе по дате, а при неизвестных датах оставляем своё.
const autoDecision = c => {
  const dated = !!(c.theirMod && c.mineMod && c.theirMod !== c.mineMod);
  const newer = c.theirMod > c.mineMod ? 'theirs' : 'mine';
  if (c.kind === 'title') {
    const m = c.mineTitle.trim(), t = c.theirTitle.trim();
    if (!m && t) return 'theirs';
    if (m && !t) return 'mine';
    return dated ? newer : 'mine';
  }
  return dated ? newer : 'both';
};

// окно разбора конфликтов при объединении; возвращает Map(srcId → решение) или null, если импорт отменён
function conflictSheet(conflicts) {

    const dec = new Map(conflicts.map(c => [c.srcId, autoDecision(c)]));
    openModal((box, api) => {

      const nm = t => (t && t.trim() ? '«' + t.trim() + '»' : '(без названия)');
      const when = ts => (ts ? fmtFull(ts) : 'дата неизвестна');
      const nText = conflicts.filter(c => c.kind === 'text').length, nTitle = conflicts.length - nText;
      const draw = () => {
        const pick = (c, v, label) => btn(label, () => { dec.set(c.srcId, v); draw(); }, dec.get(c.srcId) === v ? 'primary' : '');
        const bulk = (label, fn) => btn(label, () => { conflicts.forEach(c => dec.set(c.srcId, fn(c))); draw(); });
        box.replaceChildren(

          h('p', { class: 'msg', text: 'Найдено: ' + conflicts.length + ' (' +
            (nText ? 'название то же, текст другой — ' + nText : '') + (nText && nTitle ? '; ' : '') +
            (nTitle ? 'текст тот же, название другое — ' + nTitle : '') +
            '). Выбор уже предложен по дате изменения и наличию названия; его можно поправить. Пока вы не нажали «Применить», ничего не меняется.' }),
          h('div', { class: 'pair' }, bulk('Как предложено', autoDecision), bulk('Все мои', () => 'mine')),
          h('div', { class: 'pair' }, bulk('Все из файла', () => 'theirs'), bulk('Оставить оба', () => 'both')),
          h('div', {}, conflicts.map(c => h('div', { class: 'conf' },
            c.kind === 'text'
              ? [h('div', { class: 'tname', text: c.title }),
                 h('div', { class: 'tmeta', text: 'Название то же, текст разный · ' + c.tabName + ' › ' + c.groupLabel }),
                 h('div', { class: 'cver' }, h('b', { text: 'Мой' }), ' · ' + when(c.mineMod) + ': ' + snip(c.mineText)),
                 h('div', { class: 'cver' }, h('b', { text: 'Из файла' }), ' · ' + when(c.theirMod) + ': ' + snip(c.theirText))]
              : [h('div', { class: 'tname', text: snip(c.mineText) }),
                 h('div', { class: 'tmeta', text: 'Текст тот же, название разное · ' + c.tabName + ' › ' + c.groupLabel }),
                 h('div', { class: 'cver' }, h('b', { text: 'Моё' }), ' · ' + when(c.mineMod) + ': ' + nm(c.mineTitle)),
                 h('div', { class: 'cver' }, h('b', { text: 'Из файла' }), ' · ' + when(c.theirMod) + ': ' + nm(c.theirTitle))],
            h('div', { class: 'pair' },
              pick(c, 'mine', c.kind === 'text' ? 'Мой' : 'Моё название'),
              pick(c, 'theirs', c.kind === 'text' ? 'Из файла' : 'Из файла'),
              pick(c, 'both', 'Оба'))))),
          h('div', { class: 'btns stickfoot' },
            btn('Применить', () => { api.close(); resolve(dec); }, 'primary'),
            btn('Отменить импорт', api.dismiss, 'ghost')));
      };
      draw();
    });
  });
}

        (stat.rows ? '\nСтрок из нескольких шаблонов восстановлено у имеющихся: ' + stat.rows : ''),

    buttons: [{ label: 'Заменить данные', value: true, kind: 'danger' }, { label: 'Отмена', value: false }],
    cancelValue: false

/* ---------- автокопии: история копий в браузере + (Chrome на компьютере) файлы в выбранной папке ---------- */
const AUTO_KEY = KEY + ':auto';
var autoBusy = false;
const autoRead = () => { try { return JSON.parse(localStorage.getItem(AUTO_KEY)) || []; } catch (e) { return []; } };
const b64enc = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const b64dec = str => { const s = atob(str), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
// копии храним сжатыми (gzip), если браузер умеет; иначе как есть
async function packJson(json) {
  if (window.CompressionStream && window.Blob && Blob.prototype.stream) {
    try { const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer(); return { z: 1, d: b64enc(buf) }; } catch (e) { /* без сжатия */ }
  }
  return { z: 0, d: json };
}
async function unpackJson(entry) {
  if (!entry.z) return entry.d;
  if (!window.DecompressionStream) throw new Error('нет распаковки');
  return await new Response(new Blob([b64dec(entry.d)]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
const exportObject = (st, ts) => ({ app: 'my-templates', version: 1, appVersion: APP_VERSION, exportedAt: new Date(ts || Date.now()).toISOString(), active: st.active, tabs: st.tabs, trash: st.trash });

// --- папка для копий (File System Access API) ---
let fsHandle = null;
const idbOpen = () => new Promise((res, rej) => {
  if (!window.indexedDB) { rej(new Error('нет IndexedDB')); return; }
  const r = indexedDB.open('shablony-fs', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function idbGet(k) { const db = await idbOpen(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idbOpen(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function getDirHandle() {
  if (fsHandle) return fsHandle;
  try { fsHandle = (await idbGet('dir')) || null; } catch (e) { /* без хранилища — только на время сессии */ }
  return fsHandle;
}
async function pickBackupFolder() {
  if (!window.showDirectoryPicker) { toast('Этот браузер не умеет сохранять в папку', true); return false; }
  try {
    const dir = await window.showDirectoryPicker({ id: 'shablony-backup', mode: 'readwrite' });
    fsHandle = dir;
    try { await idbSet('dir', dir); } catch (e) { /* ок */ }
    const m = readMeta(); m.folderName = dir.name || 'папка'; m.folderNeedPerm = false; writeMeta(m);
    return true;
  } catch (e) { return false; }                         // выбор отменён
}
async function writeFolderCopy(json, ts, keep) {
  const dir = await getDirHandle(); if (!dir) return 'none';
  try {
    const perm = dir.queryPermission ? await dir.queryPermission({ mode: 'readwrite' }) : 'granted';
    if (perm !== 'granted') return 'perm';
    const d = new Date(ts), p2 = n => String(n).padStart(2, '0');
    const name = 'shablony-auto-' + d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + '_' + p2(d.getHours()) + '-' + p2(d.getMinutes()) + '.json';
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable(); await w.write(json); await w.close();
    const names = [];
    for await (const [n] of dir.entries()) if (/^shablony-auto-.*\.json$/.test(n)) names.push(n);
    names.sort();
